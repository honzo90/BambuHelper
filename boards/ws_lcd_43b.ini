; Isolated Arduino CLI profile. This is deliberately not a PlatformIO env:
; the physically validated BSP uses installed Arduino-ESP32 3.3.11 / IDF 5.5.5,
; while existing PlatformIO boards retain their Arduino 2.0.17 toolchain.
; Build: python3 -B bringup/waveshare43b/integration/build.py
[ws_lcd_43b_arduino]
fqbn = esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=custom,PSRAM=opi,DebugLevel=none,EraseFlash=none
core_version = 3.3.11
sdk_profile = cache64
app_limit = 3145728
flags =
    -DFW_VERSION="v4.0.0-beta.2"
    -DBOARD_IS_WS43B=1
    -DBOARD_MQTT_ASYNC_CONNECT=1
    -DWS43B_EXPECT_DCACHE_LINE_BYTES=64
    -DBOARD_VARIANT="ws_lcd_43b"
    -DBOARD_NAME="Waveshare_ESP32-S3-Touch-LCD-4.3B"
    -DBOARD_PANEL="ST7262_800x480_GT911"
    -DBAMBU_MONITOR_ONLY=0
    -DWS43B_FULL_WEBUI=1
    -DENABLE_OTA_AUTO=1
    -DDISPLAY_800x480=1
    -DBOARD_HAS_PSRAM=1
    -DBACKLIGHT_PIN=-1
    -DUSE_GT911=1
    -DGT911_SDA=8
    -DGT911_SCL=9
    -DGT911_INT=4
    -DESP_PANEL_BOARD_FILE_SKIP
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_4_3_B
